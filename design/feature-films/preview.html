<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merger · Product motion</title>
<style>
@font-face{font-family:Geist;src:url('./fonts/Geist.ttf');font-weight:100 900;font-display:swap}@font-face{font-family:'Geist Mono';src:url('./fonts/GeistMono.ttf');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#090b0f;color:#f3f0e9;font-family:Geist,'Segoe UI',sans-serif}main{max-width:1440px;margin:auto;padding:30px 32px 45px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.brand{font-family:'Geist',sans-serif;font-weight:600;font-size:25px;letter-spacing:-1px}.brand span{color:#d4b474;font-size:27px;margin-right:10px}.edition{font-size:11px;color:#a2aab8;letter-spacing:2px;text-transform:uppercase}
nav{display:flex;gap:8px;margin-bottom:18px}button,a{font:inherit}nav button{flex:1;text-align:left;border:1px solid #282f3a;background:#10151d;color:#a2aab8;padding:17px 20px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer}nav button span{font-size:11px;color:#777f8d;margin-right:12px}nav button[aria-selected=true]{color:#efd69f;border-color:#b5945a;background:#d4b4740c}button:hover{border-color:#d4b474}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #e0c18c;outline-offset:4px}.stage{border:1px solid #303641;border-radius:15px;overflow:hidden;background:#090b0f;aspect-ratio:8/5}.stage svg{width:100%;height:100%;display:block}.controls{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}.controls button{min-width:88px;background:#181e27;color:#edeae3;border:1px solid #353e4a;border-radius:7px;padding:10px 13px;font-size:12px;cursor:pointer}input{flex:1;min-width:100px;accent-color:#d4b474;height:24px}output{font-size:12px;color:#a2aab8;min-width:105px;font-variant-numeric:tabular-nums}.download{color:#d4b474;font-size:12px;text-decoration:none;padding:10px;border-radius:6px;border:1px solid #3e382c}.note{margin:19px 0 0;font-size:12px;color:#939ca9;line-height:1.7;max-width:850px}.sr{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}
@media(max-width:650px){main{padding:20px 12px}header{margin-bottom:20px}.edition{font-size:9px;letter-spacing:1px}nav{gap:5px}nav button{font-size:11px;padding:13px 9px}nav button span{display:block;margin-bottom:5px}.controls{gap:8px}output{min-width:85px}input{min-width:80px}.stage{border-radius:9px}.note{font-size:11px}}
</style></head><body><main>
<header><div class="brand"><span>◇</span>merger</div><div class="edition">Product motion / Three stories</div></header>
<nav role="tablist" aria-label="Feature animation"><button id="tab-channels" role="tab" aria-selected="true" aria-controls="stage" data-film="channels"><span>01</span>All your conversations</button><button id="tab-deals" role="tab" aria-selected="false" aria-controls="stage" tabindex="-1" data-film="deals"><span>02</span>Automatic deal detection</button><button id="tab-documents" role="tab" aria-selected="false" aria-controls="stage" tabindex="-1" data-film="documents"><span>03</span>People & paperwork</button></nav>
<section id="stage" class="stage" role="tabpanel" aria-labelledby="tab-channels"><img src="channels-poster.png" alt="Messaging channels and deal context inside Merger" style="width:100%"></section>
<div class="controls"><button type="button" id="play">Pause</button><button type="button" id="replay">Replay</button><label class="sr" for="timeline">Animation timeline</label><input id="timeline" type="range" min="0" max="16" step=".05" value="0"><output id="clock">0.0 / 16.0 s</output><a class="download" id="download" href="channels.mp4" download>Download MP4</a></div>
<p class="note" id="description">Illustrative product animations using sample data. No accounts are connected and no messages or documents are sent.</p>
</main><script type="module" src="./player.mjs"></script></body></html>
